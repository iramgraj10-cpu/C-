# Compila y prueba la versión de escritorio para Windows en una máquina Windows de GitHub
# (WinUI solo se puede compilar en Windows). El resultado es un .zip descargable desde la
# pestaña Actions: se descomprime y se abre CSharpMastery.App.exe, sin instalar .NET.
name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Instalar la carga de trabajo de MAUI para Windows
        run: dotnet workload install maui-windows

      - name: Pruebas (incluye el motor de ejecución real en Windows)
        run: dotnet test tests/CSharpMastery.Tests -c Release --logger "trx;LogFileName=pruebas.trx" --results-directory resultados

      # Muestra cada prueba fallida como anotación del job (se leen sin descargar el registro completo).
      - name: Resumen de pruebas fallidas
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem resultados -Filter *.trx -Recurse | Select-Object -First 1
          if (-not $trx) { Write-Output "::error title=Sin resultados::No se generó el archivo de resultados"; exit 0 }
          [xml]$x = Get-Content $trx.FullName
          $fallidas = $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }
          Write-Output "::warning title=Pruebas fallidas::$(@($fallidas).Count) de $($x.TestRun.ResultSummary.Counters.total)"
          foreach ($t in $fallidas) {
            $msg = ($t.Output.ErrorInfo.Message + ' ' + $t.Output.StdOut) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            if ($msg.Length -gt 3500) { $msg = $msg.Substring(0, 3500) }
            Write-Output "::error title=$($t.testName)::$msg"
          }

      - name: Publicar la app de escritorio
        shell: pwsh
        run: |
          dotnet publish src/CSharpMastery.App -f net10.0-windows10.0.19041.0 -c Release `
            -o publish/CSharpMastery-windows-x64 2>&1 | Tee-Object -FilePath publicar.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Los errores de compilación se muestran como anotaciones (se leen sin descargar el registro).
            $errores = Select-String -Path publicar.log -Pattern ': error |error MSB|error NETSDK|error XC|error WMC' | Select-Object -ExpandProperty Line -Unique | Select-Object -First 10
            foreach ($e in $errores) { Write-Output "::error title=Publicar::$($e.Trim() -replace '%','%25')" }
            if (-not $errores) { Get-Content publicar.log -Tail 15 | ForEach-Object { Write-Output "::error title=Publicar (final del registro)::$($_ -replace '%','%25')" } }
            exit $code
          }

      - name: Comprobar que el ejecutor de código quedó junto a la app
        shell: pwsh
        run: |
          if (-not (Test-Path publish/CSharpMastery-windows-x64/CSharpMastery.App.exe)) { throw "Falta CSharpMastery.App.exe" }
          if (-not (Test-Path publish/CSharpMastery-windows-x64/runner)) { throw "Falta la carpeta runner" }
          Get-ChildItem publish/CSharpMastery-windows-x64/runner | Select-Object -First 5

      - uses: actions/upload-artifact@v4
        with:
          name: CSharpMastery-windows-x64
          path: publish/CSharpMastery-windows-x64
